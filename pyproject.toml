[project]
name = "vrr-agent-open"
version = "0.1.0"
description = "Open-source VRR Reasoning & Lineage agent — LangGraph + PostgreSQL/pgvector + Unity Catalog OSS + MLflow, all local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vamshi singam" }]
dependencies = [
    "psycopg[binary]>=3.2",       # PostgreSQL driver (data + compute)
    "pgvector>=0.3",              # knowledge embeddings in Postgres
    "langgraph>=0.2",            # agent orchestration
    "langchain-core>=0.3",
    "mlflow>=2.16",              # OSS tracing / eval / registry
    "streamlit>=1.36",          # review + approval UI
    "pydantic>=2.7",
    "httpx>=0.27",              # LLM calls (Ollama / any OpenAI-compatible)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
